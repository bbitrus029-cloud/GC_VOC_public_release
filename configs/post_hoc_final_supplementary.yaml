common_statistics:
  single_auroc_delong:
    implementation_module_future: src/analysis/posthoc_final_common.py
    reuses_core_from: src/evaluation/statistical_tests.py
    core_function: _fast_delong
    degenerate_variance_epsilon_import: DEGENERATE_VARIANCE_EPSILON
    degenerate_variance_epsilon_value: 1.0e-12
    standalone_delong_module_permitted: false
    paired_delong_is_substitute: false
    label_domain:
    - 0
    - 1
    recoding_arbitrary_two_class_values_forbidden: true
    absent_class_point_and_ci_reason: absent_outcome_class
    point_tie_credit: 0.5
    core_crosscheck_argsort: np.argsort(-y_true, kind="mergesort")
    core_crosscheck_tolerance: 1.0e-12
    ci_requires_min_positives: 2
    ci_requires_min_negatives: 2
    insufficient_class_count_ci_reason: insufficient_class_count_for_delong_ci
    alpha: 0.05
    z_source: scipy.stats.norm.ppf(0.975)
    interval_form: auc ± z * sqrt(variance)
    variance_source: float(covariance[0,0])
    clip_limits_to:
    - 0.0
    - 1.0
    ci_method: delong_normal_clipped
    ci_random_seed: null
    variance_nonfinite_reason: delong_variance_nonfinite
    variance_negative_reason: delong_variance_negative
    variance_below_epsilon_reason: delong_variance_below_epsilon
    zero_width_interval_forbidden: true
    fallback_intervals_forbidden:
    - bootstrap
    - exact_interval
    - continuity_correction
    - any_other_substitute
  wilson_sensitivity_specificity:
    function: statsmodels.stats.proportion.proportion_confint
    method: wilson
    alpha_two_sided: 0.05
    ci_level: 0.95
    resampling: false
    statsmodels_version: 0.14.6
  likelihood_ratios:
    notation:
      TP: true_positive_uncorrected
      FN: false_negative_uncorrected
      TN: true_negative_uncorrected
      FP: false_positive_uncorrected
      P: TP + FN
      N: TN + FP
    always_preserve_uncorrected_counts_sensitivity_specificity: true
    absent_class_rule: If P=0 or N=0, both LRs and their CIs are non-estimable; the 0.5 correction must not invent an absent
      outcome class.
    haldane_anscombe_rule: If both classes exist and one or more confusion cells is zero, add 0.5 to all four cells for LR
      point estimates and CIs only; set zero_cell_correction=haldane_anscombe_all_cells.
    zero_cell_correction_code: haldane_anscombe_all_cells
    formulas:
      LR_plus: (TP*/P*) / (FP*/N*)
      LR_minus: (FN*/P*) / (TN*/N*)
      SE_log_LR_plus: sqrt(1/TP* - 1/P* + 1/FP* - 1/N*)
      SE_log_LR_minus: sqrt(1/FN* - 1/P* + 1/TN* - 1/N*)
      CI: exp(log(LR) ± z_0.975 * SE[log(LR)])
      z_source: scipy.stats.norm.ppf(0.975)
      scipy_version: 1.17.1
    nonestimable_reasons:
    - absent_outcome_class
    - invalid_lr_denominator
    - nonfinite_lr
    populations:
    - frozen_primary_internal_test
    - difficult_spectrum_oof
    - difficult_spectrum_test
    - strict_qc5_oof
    - strict_qc5_test
    full_cohort_oof_lr_forbidden: true
    stage7_secondary_table_retrofit_forbidden: true
    primary_test_assert_against_frozen_metric_sources: true
  missing_data_policy: no_imputation_alignment_failure_halts_nonestimable_retained
  full_precision_machine_outputs: true
  rounding_only_in_human_report: true

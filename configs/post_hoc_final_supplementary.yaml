  estimator: pair_weighted_conditional_concordance
  formulas:
    P_d: n_positive_d * n_negative_d
    C_d: sum over within-date positive-negative pairs of 1(score_pos>score_neg) + 0.5*1(tied)
    C_within: sum_d(C_d) / sum_d(P_d)
  tie_credit: 0.5
  equal_date_weighted_alternative_forbidden: true
  date_label_persistence_forbidden: true
  uncertainty:
    method: nonparametric_comparable_date_cluster_bootstrap
    rng: np.random.default_rng(42)
    independent_streams_per_view: true
    bootstrap_seed: 42
    n_draws_when_G_ge_10: 2000
    n_bootstrap_valid_equals_attempts_when_G_ge_10: true
    quantile_method: linear
    quantile_probs:
    - 0.025
    - 0.975
    class_collapse_retry_forbidden: true
    attempt_cap_20000_applies: false
    rules:
      G_ge_10: point_and_ci_estimable; n_bootstrap_valid=n_bootstrap_attempts=2000; bootstrap_seed=42
      G_1_to_9: point_estimable; ci_status=non_estimable; ci_nonestimable_reason=fewer_than_10_comparable_date_groups; no
        bootstrap; counts zero; bootstrap_seed missing
      G_0: point_and_ci_non_estimable; reason=no_comparable_date_groups; no bootstrap; counts zero; bootstrap_seed missing
  interpretation_limits:
  - controls_shared_calendar_date_structure_only
  - cannot_eliminate_environmental_temporal_procedural_or_device_drift_explanations

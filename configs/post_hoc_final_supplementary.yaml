      - q3
      quantile_interpolation: linear
      variance_ddof: 1
      smd: (mean_included-mean_excluded)/sqrt((var_included+var_excluded)/2)
      variance_smd_requires_at_least_two_nonmissing_per_group: true
      support_rule_applies_only_to_age: true

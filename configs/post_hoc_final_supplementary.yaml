    reference_standard_timing_audit:
      path: outputs/analysis/posthoc_final_reference_standard_timing_audit.json
      schema:
        schema_completeness: complete_before_session_1
        top_level_key_order:
        - schema_version
        - package_id
        - generated_at_utc
        - facts
        - access_state
        - prohibited_fields
        undeclared_top_level_key_policy: reject
        undeclared_nested_key_policy: reject
        wrong_dtype_policy: reject
        self_hash_forbidden: true
        missing_representation_json_null_only_where_nullable_true: true
        permitted_provenance_timestamp_fields:
        - generated_at_utc
        leaf_contracts:
          schema_version:
            order: 1
            logical_type: string
            nullable: false
            allowed_value: posthoc_final_reference_standard_timing_audit.v1
          package_id:
            order: 2
            logical_type: string
            nullable: false
            allowed_value: posthoc_final_supplementary
          generated_at_utc:
            order: 3
            logical_type: string
            nullable: false
            pattern: utc_iso8601_z_allowlisted_provenance_timestamp
            allowlisted_provenance_timestamp: true
          facts:
            order: 4
            logical_type: array
            nullable: false
            exact_item_count: 13
            item_order_identity_fixed_by_fact_id_display_order: true
            item_key_order:
            - fact_id
            - display_order
            - subject
            - conservative_statement_or_nonclaim
            - evidence_status
            - permitted_manuscript_implication
            - prohibited_stronger_wording
            - source_reference
            undeclared_item_key_policy: reject
            item_leaves:
              fact_id:
                logical_type: string
                nullable: false
                allowed_values_in_order:
                - RS01
                - RS02
                - RS03
                - RS04
                - RS05
                - RS06
                - RS07
                - RS08
                - RS09
                - RS10
                - RS11
                - RS12
                - RS13
              display_order:
                logical_type: integer
                nullable: false
                minimum: 1
                maximum: 13
              subject:
                logical_type: string
                nullable: false
              conservative_statement_or_nonclaim:
                logical_type: string
                nullable: false
              evidence_status:
                logical_type: string
                nullable: false
                allowed_values:
                - repository_supported
                - investigator_attested
                - not_systematically_recorded
                - prohibited_claim
              permitted_manuscript_implication:
                logical_type: string
                nullable: false
              prohibited_stronger_wording:
                logical_type: string
                nullable: false
              source_reference:
                logical_type: string
                nullable: true
                missing_representation: null
                project_relative_path_only_when_populated: true
                absolute_path_forbidden: true
          access_state:
            order: 5
            logical_type: object
            nullable: false
            key_order:
            - session_activity
            - cumulative_through_session
            undeclared_key_policy: reject
            session_activity: *id019
            cumulative_through_session: *id019
          prohibited_fields:
            order: 6
            logical_type: array
            nullable: false
            item_logical_type: string
            exact_values_in_order:
            - collection_time
            - collection_location
            - sample_id
            - filename
            - participant_level_scores
            - exact_clinical_collection_dates
        upgrade_investigator_attested_to_repository_supported_without_direct_repository_evidence_forbidden: true
      planned_fact_records:
      - fact_id: RS01
        display_order: 1
        subject: HC reference standard
        conservative_statement_or_nonclaim: HC reference standard is based on endoscopic morphology; biopsy is generally not
          clinically indicated for this category.
        evidence_status: investigator_attested
        permitted_manuscript_implication: May state morphology-based HC reference with biopsy-not-generally-indicated wording.
        prohibited_stronger_wording: Do not claim universal biopsy confirmation for HC.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS02
        display_order: 2
        subject: BGL reference standard mixture
        conservative_statement_or_nonclaim: BGL was confirmed by a mixture of endoscopic morphology and biopsy; exact proportions
          are unavailable.
        evidence_status: not_systematically_recorded
        permitted_manuscript_implication: May disclose mixed confirmation and unavailable exact proportions.
        prohibited_stronger_wording: Do not invent BGL morphology/biopsy proportions.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS03
        display_order: 3
        subject: LGIN biopsy and undergrading
        conservative_statement_or_nonclaim: LGIN had pre-breath biopsy pathology, possible biopsy undergrading, and no complete
          ESD resection specimen during the study period.
        evidence_status: investigator_attested
        permitted_manuscript_implication: Disclose possible LGIN undergrading and absence of complete resection pathology.
        prohibited_stronger_wording: Do not treat LGIN biopsy as equivalent to complete resection pathology.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS04
        display_order: 4
        subject: Disposition not pathological gold standard
        conservative_statement_or_nonclaim: Inpatient/outpatient disposition is not a pathological gold standard.
        evidence_status: repository_supported
        permitted_manuscript_implication: State disposition is not a pathological gold standard and is excluded from modeling.
        prohibited_stronger_wording: Do not treat collection_location/disposition as disease truth.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS05
        display_order: 5
        subject: HGIN EGC AGC resection pathology timing
        conservative_statement_or_nonclaim: HGIN, EGC, and AGC final categories were based on complete endoscopic or surgical
          resection pathology, which may have occurred after breath collection.
        evidence_status: investigator_attested
        permitted_manuscript_implication: Disclose possible post-breath final resection pathology.
        prohibited_stronger_wording: Do not claim all high-grade labels were finalized before breath collection.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS06
        display_order: 6
        subject: Clinician result-unawareness
        conservative_statement_or_nonclaim: Clinicians responsible for routine endoscopy, pathology reporting, and treatment
          were unaware of future participation and breath-test results; wording is conservative result-unawareness, not a
          research-grade adjudication-blinding claim.
        evidence_status: investigator_attested
        permitted_manuscript_implication: Use conservative result-unawareness wording only.
        prohibited_stronger_wording: Do not claim unsupported research-grade outcome-adjudication blinding.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS07
        display_order: 7
        subject: Collector blinding undocumented
        conservative_statement_or_nonclaim: Collector blinding was not documented.
        evidence_status: not_systematically_recorded
        permitted_manuscript_implication: State collector blinding was not documented.
        prohibited_stronger_wording: Do not claim collector blinding.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS08
        display_order: 8
        subject: Breath after gastroscopy/biopsy before treatment
        conservative_statement_or_nonclaim: Breath collection occurred after diagnostic gastroscopy and indicated biopsy but
          before treatment.
        evidence_status: repository_supported
        permitted_manuscript_implication: State post-gastroscopy/indicated-biopsy, pre-treatment sampling chronology.
        prohibited_stronger_wording: Do not claim pre-endoscopy triage validation.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS09
        display_order: 9
        subject: Interval distribution unavailable
        conservative_statement_or_nonclaim: The exact gastroscopy/biopsy-to-breath interval distribution was not systematically
          recorded.
        evidence_status: not_systematically_recorded
        permitted_manuscript_implication: Disclose briefly as a reporting fact, not a separate major Discussion limitation.
        prohibited_stronger_wording: Do not invent interval statistics.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS10
        display_order: 10
        subject: No generally-under-three-months claim
        conservative_statement_or_nonclaim: No 'generally under three months' interval claim is supported.
        evidence_status: prohibited_claim
        permitted_manuscript_implication: Omit any 'generally under three months' wording.
        prohibited_stronger_wording: Do not state generally-under-three-months timing.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS11
        display_order: 11
        subject: No confirmed central pathology review
        conservative_statement_or_nonclaim: No confirmed central pathology review claim is supported.
        evidence_status: prohibited_claim
        permitted_manuscript_implication: Do not claim central pathology review.
        prohibited_stronger_wording: Do not invent central review.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS12
        display_order: 12
        subject: Differential reference standards disclosure
        conservative_statement_or_nonclaim: Differential reference standards across disease categories must be disclosed.
        evidence_status: repository_supported
        permitted_manuscript_implication: Disclose differential reference standards.
        prohibited_stronger_wording: Do not imply a uniform reference standard.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      - fact_id: RS13
        display_order: 13
        subject: Principal limitation pre-endoscopy triage
        conservative_statement_or_nonclaim: The principal limitation is lack of direct pre-endoscopy-triage validation due
          to post-gastroscopy/indicated-biopsy sampling.
        evidence_status: repository_supported
        permitted_manuscript_implication: Foreground this principal limitation.
        prohibited_stronger_wording: Do not claim direct pre-endoscopy-triage validation.
        source_reference: nullable_project_relative_path_or_null
        source_reference_nullability: true
      planned_fact_count: 13

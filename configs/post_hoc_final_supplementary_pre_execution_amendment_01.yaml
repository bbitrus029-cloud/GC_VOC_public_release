proposed_date_parsing_replacement_contract:
  status: approved_descriptive_contract_for_additive_freeze
  role: methods_and_provenance_description_not_runtime_overlay_payload
  replaces: superseded_session_0_date_parsing_contract
  base_target_key_path: loaders.date_parsing
  sole_runtime_overlay_payload_source_key_path: overlay_application_contract.overlay_date_parsing_payload
  must_remain_semantically_consistent_with_overlay_date_parsing_payload: true
  semantic_conflict_with_runtime_payload_fails_validation: true
  source_field: collection_time
  source_file: data/processed/sample_index.csv
  accepted_grammar: slash_encoded_date_only_ascii
  regex_full_match: '^([0-9]{4})/([0-9]{1,2})/([0-9]{1,2})$'
  year_digits: 4
  month_digits: one_or_two
  day_digits: one_or_two
  reject:
  - missing_values
  - non_string_values
  - whitespace
  - time_of_day_content
  - extra_tokens
  - ambiguous_or_non_slash_forms
  - iso_yyyy_mm_dd_forms
  - unicode_or_non_ascii_digits
  parse_steps:
  - fullmatch_ascii_slash_grammar_and_capture_three_numeric_tokens
  - convert_year_month_day_tokens_to_integers_without_generic_inference
  - validate_real_calendar_date_with_pd_to_datetime_format_yyyy_mm_dd_exact_true_errors_raise
  - require_midnight_normalized_parsed_timestamp
  - require_parsed_year_month_day_equal_original_numeric_tokens
  - canonicalize_in_memory_only_to_stable_calendar_date_for_grouping
  mapping_invariants:
    raw_unique_string_to_normalized_date_must_be_one_to_one: true
    normalization_collision_forbidden: true
  persistence_policy:
    persist_raw_date_labels: false
    persist_normalized_date_labels: false
    persist_date_hashes: false
    persist_date_lookup_tables: false
    persist_participant_date_mappings: false
    persist_date_group_id: false
    report_failures_as_aggregate_counts_only: true
    errors_must_not_echo_value_id_or_date: true
  immutable_source_policy:
    rewrite_sample_index_forbidden: true
    regenerate_sample_index_forbidden: true
    normalize_on_disk_forbidden: true
    canonicalization_is_lossless_representation_conversion_not_imputation: true

required_future_session_1_code_corrections:
  status: recorded_for_review_not_implemented_in_this_step
  corrections:
  - id: C01
    summary: Implement --execute-approved as the real Session 4 execution path instead of a placeholder RuntimeError.
    evidence: scripts/run_posthoc_final_locked_scores.py raises RuntimeError for --execute-approved.
  - id: C02
    summary: Session 1 must implement the complete Analyses 1, 2, and 4 framework that Session 4 later executes.
    details:
    - exact real-data minimal loaders
    - difficult-spectrum metrics and composition
    - strict-QC5 metrics, correctness, and composition
    - frozen-primary-test LR augmentation
    - within-date concordance
    - four exact scientific CSV schemas and row inventories
    - two isolated deterministic candidate computations
    - schema/privacy/source validation
    - individual atomic promotion
    - sanitized completion log promoted last
    evidence: current locked-score module exposes score-blind preflight plus incomplete synthetic-only execute_approved_framework
      stub.
  - id: C03
    summary: Replace the test that prohibits Session 4 output paths from appearing in Session 1 implementation.
    evidence: 'tests/test_posthoc_final_locked_scores.py::test_session_one_does_not_declare_completion_or_later_outputs contradicts
      active architecture.'
  - id: C04
    summary: Difficult-spectrum disease counts must be calculated from the restricted population with zero-preserving six
      rows.
    details:
    - excluded HC and AGC counts equal zero
    - six counts sum to restricted n
    evidence: difficult_spectrum_filter currently counts categories before restriction and attaches unrestricted counts.
  - id: C05
    summary: QC5 correctness must use exact configured strict_status values.
    required_values:
    - strict_pass
    - strict_fail
    - not_applicable
    evidence: strict_qc5_correctness_inventory currently emits pass/fail/pass_minus_fail labels.
  - id: C06
    summary: Replace chained vector-length comparison with an exact all-vector alignment check.
    evidence: 'strict_qc5_correctness_inventory uses len(a) != len(b) != len(c) != len(d), which is logically insufficient.'
  - id: C07
    summary: Pre-access authority and entry gate before any participant-level value access.
    details:
    - validate active plan and all four active-rule hashes
    - validate all required annotated-tag ancestry
    - validate original Session 0 commit, sole parent, exact three paths, and blobs
    - validate amendment commit, sole parent, exact three paths, and blobs
    - validate original and amendment approval evidence
    - validate immutable base config and bounded loaders.date_parsing overlay
    - validate stale targets and completion logs
    - validate entry hashes for all required frozen inputs
    - all of the above before participant-level value access
    - does_not_require_exit_rehash_before_participant_access
    evidence: current preflight validates only the Session 0 freeze commit and frozen-input hashes and lacks dual-freeze/overlay/tag/stale-target
      completeness.
  - id: C08
    summary: Machine-enforce complete nested schema semantics, row inventories, dtype/nullability, status/reason dependencies,
      access-state values, and hash-map ordering.
    evidence: validate_preflight_schema docstring and body enforce only an essential subset.
  - id: C09
    summary: Synthetic unit tests must cover the ASCII slash-format parser.
    details:
    - valid one- and two-digit month/day components
    - invalid calendars
    - whitespace and time-content rejection
    - ISO rejection
    - extra-token rejection
    - Unicode/non-ASCII digit rejection
    - mapping collision detection
    - sanitized no-echo failures
    evidence: current date tests and fixtures use ISO YYYY-MM-DD only.
  - id: C10
    summary: No second preflight may occur until reviewed corrections are implemented, synthetic tests pass, dual-freeze validates,
      and retry conditions are all satisfied.
    evidence: governance gate defined by this amendment candidate.
  - id: C11
    summary: Access-state ledger must reflect actual access, including QC false when QC is not reached.
    evidence: build_session_1_access_state currently hard-codes participant_level_qc_values_read true even though the failed
      attempt never reached QC.
  - id: C12
    summary: Privacy validators that reject leaked clinical dates must recognize both ISO-like and slash-like forms without
      echoing matched values.
    evidence: validate_preflight_privacy currently regex-matches only YYYY-MM-DD date values.
  - id: C13
    summary: Replace the ISO-only parser used by real preflight and later date-based analyses with the exact amended ASCII
      slash parser.
    details:
    - single-value and series parsers share the same frozen contract
    - canonicalized dates used only in memory
    - no on-disk source rewrite
    evidence: posthoc_final_common.py currently implements only YYYY-MM-DD parsing used by preflight and within-date paths.
  - id: C14
    summary: Persist computed aggregates into the preflight candidate; do not reconstruct literals after asserting anchors.
    details:
    - date-feasibility and QC5 reconciliation values must come from objects just computed from validated inputs
    - frozen constants may be comparison anchors only
    - do not assert equality then write separate literal 40/34 or 974/298/676 values
    - cohort, view, disease-composition, and access-state values must reflect computed or actually observed state
    evidence: run_score_blind_preflight asserts anchors then writes separate literal OrderedDict date/QC5 values into aggregate_counts.
  - id: C15
    summary: Post-computation, pre-promotion source-integrity gate.
    details:
    - after permitted computation and immediately before candidate promotion, re-hash every required source/container
    - require exit hashes to equal entry hashes and frozen authority hashes
    - any mismatch fails closed without promotion or leftover temporary artifacts
    - entry hashing itself belongs to C07 and occurs before participant-level access
    evidence: current preflight hashes inputs once at entry and does not re-validate before promotion.
  - id: C16
    summary: Full orchestration and call-order synthetic tests of the real preflight orchestrator.
    details:
    - complete authority validation before participant-level value access
    - both original and amendment freeze chains validated
    - stale target and completion-log checks before participant access
    - prediction headers and exact ordered usecols enforced
    - p_raw, p_cal, and collection_location never requested in score-blind mode
    - label/date reads only after authority gates
    - QC reads only after date parsing and alignment succeed
    - date-parse failure leaves QC access false
    - all failure stages produce truthful access-state values
    - before/after hashes checked
    - no failure promotes a candidate or leaves a temporary file
    - success promotes only the exact preflight target
    - privacy validation recognizes ISO-like and slash-like leaked dates without echoing matches
    evidence: current tests cover helpers and CLI mode selection but not full dual-freeze orchestrator call order on intercepted/synthetic
      reads.

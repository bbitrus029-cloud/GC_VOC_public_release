# CNN-BiLSTM-Attention nested-CV configuration for Session 9.
# Governing plan sections: §3.10, §5.10, §6.2.
# Early-stopping policy is binding via Errata E005 and E006 in
# .cursor/plans/modeling_plan_v1_a7c3f9b2_dc789bb5.plan.md.
provenance:
  operational_plan: ".cursor/plans/modeling_plan_v1_a7c3f9b2_dc789bb5.plan.md"
  governing_sections:
    - "§3.10"
    - "§5.10"
    - "§6.2"
  errata:
    - "E005"
    - "E006"

model_name: cnn_bilstm_attention
pipeline: A
input_layout: NCL

random_seed: 42  # [project-reproducibility-convention]

class_imbalance:
  mechanism: dl_two_class_weighted_loss

hyperparameter_candidates:
  # Config A [hyperparameter-range-from-domain-practice]
  # Authority: Erratum E006 baseline, matching CNNBiLSTMAttentionClassifier.DEFAULT_HPARAMS.
  - cnn_channels: [16, 32]
    cnn_kernel_size: 5
    lstm_hidden: 16
    lstm_layers: 1
    attention_dim: 16
    dropout: 0.10
    lr: 1.0e-3
    weight_decay: 1.0e-4
    batch_size: 32

  # Config B [hyperparameter-range-from-domain-practice]
  # Authority: Erratum E006 CNN capacity axis.
  - cnn_channels: [32, 64]
    cnn_kernel_size: 5
    lstm_hidden: 16
    lstm_layers: 1
    attention_dim: 16
    dropout: 0.10
    lr: 1.0e-3
    weight_decay: 1.0e-4
    batch_size: 32

  # Config C [hyperparameter-range-from-domain-practice]
  # Authority: Erratum E006 sequence model capacity axis.
  - cnn_channels: [16, 32]
    cnn_kernel_size: 5
    lstm_hidden: 32
    lstm_layers: 2
    attention_dim: 32
    dropout: 0.10
    lr: 1.0e-3
    weight_decay: 1.0e-4
    batch_size: 32

  # Config D [hyperparameter-range-from-domain-practice]
  # Authority: Erratum E006 regularization axis.
  - cnn_channels: [16, 32]
    cnn_kernel_size: 5
    lstm_hidden: 16
    lstm_layers: 1
    attention_dim: 16
    dropout: 0.30
    lr: 1.0e-3
    weight_decay: 1.0e-4
    batch_size: 32

training:
  # max_epochs: [hyperparameter-range-from-domain-practice]
  # Authority: Erratum E006, aligned to the InceptionTime Session 8 upper bound.
  max_epochs: 200
  precision: 16-mixed
  deterministic: true
  accelerator: gpu
  devices: 1
  # Early stopping configuration locked by Erratum E005 (2026-05-18).
  # Original E004-locked values (monitor=val_auc, mode=max, patience=20) triggered
  # Post-hoc G in the first Session 8 run due to val_auc dominance by holdout-size
  # noise (Hanley-McNeil SE ~0.047 at n_holdout=78). Adjusted to val_loss + mode=min
  # + patience=40 per E005; supporting authority Reimers & Gurevych 2017 (EMNLP).
  # These values apply identically to Session 9 (CNN-BiLSTM-Attention) and to
  # Stage 4b DL final training (Session 10 Phase 2) per E005 scope.
  early_stopping:
    monitor: val_loss  # [hyperparameter-range-from-domain-practice; locked by E005]
    mode: min  # [hyperparameter-range-from-domain-practice; locked by E005]
    patience: 40  # [hyperparameter-range-from-domain-practice; locked by E005]
  csv_logger:
    path: outputs/logs/lightning_csv/binary_cnn_bilstm_attention
  nan_retry:
    enabled: true
    lr_halving: true
    max_retries: 1

bootstrap:
  n_boot_source: modeling_global.bootstrap.n_boot

paths:
  nested_cv_oof: outputs/predictions/binary_cnn_bilstm_attention_nested_cv_oof.csv
  nested_cv_per_fold: outputs/predictions/binary_cnn_bilstm_attention_nested_cv_per_fold.csv
  nested_cv_summary: outputs/metrics/binary_cnn_bilstm_attention_nested_cv_summary.csv
  nested_cv_results: outputs/analysis/binary_cnn_bilstm_attention_nested_cv_results.json
  attention_npz: outputs/shap/binary_cnn_bilstm_attention_nested_cv_attention.npz
  log: outputs/logs/train_cnn_bilstm_attention.log
